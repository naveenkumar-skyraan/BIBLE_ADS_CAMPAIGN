<!doctype html>
<meta charset="utf-8" />
<title>Wallet checkout test</title>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<body style="font-family:sans-serif;max-width:560px;margin:40px auto">
  <h3>Wallet top-up test</h3>
  <input id="token" placeholder="Bearer token (JWT)" style="width:100%" /><br /><br />
  <input id="amount" type="number" value="150" />
  <button onclick="pay()">Create order & pay</button>
  <pre id="out"></pre>

<script>
  const out = document.getElementById("out");
  const cashfree = Cashfree({ mode: "sandbox" });
  const headers = () => ({
    "Content-Type": "application/json",
    Authorization: "Bearer " + document.getElementById("token").value.trim(),
  });

  // keep the token across the Cashfree redirect
  document.getElementById("token").value = sessionStorage.getItem("t") || "";

  async function pay() {
    sessionStorage.setItem("t", document.getElementById("token").value.trim());
    const res = await fetch("/api/wallet/topups", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ amount: Number(document.getElementById("amount").value) }),
    });
    const json = await res.json();
    out.textContent = JSON.stringify(json, null, 2);
    if (!json.success) return;
    cashfree.checkout({
      paymentSessionId: json.data.payment_session_id,
      redirectTarget: "_self",
    });
  }

  // after Cashfree redirects back, verify automatically
  const orderId = new URLSearchParams(location.search).get("order_id");
  if (orderId) {
    fetch("/api/wallet/topups/verify", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ order_id: orderId }),
    })
      .then((r) => r.json())
      .then((j) => (out.textContent = "VERIFY RESULT\n" + JSON.stringify(j, null, 2)));
  }
</script>
</body>
